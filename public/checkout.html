<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — BlockHost</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="logo">Block<span>Host</span></div>
  <nav><a href="index.html">← Back to plans</a></nav>
</header>

<div class="wrap" id="checkoutView">
  <h2 class="section-title">Checkout</h2>
  <div class="grid2">
    <div class="card">
      <h3 style="margin-top:0">Your details</h3>
      <label for="name">Full name</label>
      <input id="name" placeholder="Sariful Sahaji" />
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <label for="phone">Phone</label>
      <input id="phone" placeholder="+91 90000 00000" />

      <h3 style="margin-top:24px">Payment method</h3>
      <div class="pay-methods">
        <label><input type="radio" name="pm" value="upi" checked /> UPI</label>
        <label><input type="radio" name="pm" value="card" /> Credit / Debit card</label>
        <label><input type="radio" name="pm" value="netbanking" /> Netbanking</label>
        <label><input type="radio" name="pm" value="wallet" /> Wallet</label>
      </div>
      <div class="note" id="modeNote">Demo mode: no real money will be charged.</div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Order summary</h3>
      <div class="cycle-toggle" id="cycleToggle">
        <button data-cycle="monthly" class="active">Monthly</button>
        <button data-cycle="quarterly">Quarterly · 10% off</button>
        <button data-cycle="yearly">Yearly · 20% off</button>
      </div>
      <div id="planLine" style="font-weight:700;font-size:17px"></div>
      <div id="planMeta" style="color:var(--muted);font-size:14px;margin-bottom:12px"></div>
      <div class="summary-row"><span>Subtotal</span><span id="sub">₹0</span></div>
      <div class="summary-row"><span>GST (18%)</span><span id="gst">₹0</span></div>
      <div class="summary-row total"><span>Total</span><span id="total">₹0</span></div>
      <button class="btn" id="payBtn" style="width:100%;margin-top:18px">Pay now</button>
    </div>
  </div>
</div>

<div class="wrap" id="successView" style="display:none">
  <div class="card success">
    <div class="tick">✅</div>
    <h2>Payment successful</h2>
    <p style="color:var(--muted)">Order ID: <b id="orderId" style="color:var(--text)"></b></p>
    <p style="color:var(--muted)" id="successNote"></p>
    <a class="btn" href="dashboard.html">Go to my dashboard →</a>
  </div>
</div>

<script src="app.js"></script>
<script>initCheckout();</script>
</body>
</html>
